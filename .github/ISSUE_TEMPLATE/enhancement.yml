# Field ids below are prefilled by hub_report_issue (_bugReportSubmitUrl in libraries/mcp-debug-logging-lib.groovy).
# GitHub renders this form from the default branch and silently drops an unknown id, so keep the two lists in sync.
name: Enhancement / feature request
description: Suggest a new feature or behavior change for the Hubitat MCP server.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what_request
    attributes:
      label: What feature or behavior change you'd like
      description: Describe the enhancement in your own words. What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: agent_report
    attributes:
      label: Agent report output (optional)
      description: If you used the `generate_bug_report` tool with issueType=enhancement, paste its output here.
      render: markdown
    validations:
      required: false
  - type: input
    id: mcp_version
    attributes:
      label: MCP server version
    validations:
      required: false
  - type: input
    id: hub_firmware
    attributes:
      label: Hub firmware
    validations:
      required: false
  - type: input
    id: mcp_client
    attributes:
      label: MCP client (host app / self-report)
    validations:
      required: false
