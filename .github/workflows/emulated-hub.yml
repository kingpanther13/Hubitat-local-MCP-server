name: Software E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  # A new PR head or main push cancels the previous wait; manual dispatches are keyed by SHA and never cancelled.
  group: software-e2e-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  revision:
    name: Software E2E eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.revision.outputs.eligible }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Select exact tested revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REVISION: ${{ github.sha }}
        run: >-
          python .github/scripts/software_e2e_result.py
          --event-file "$EVENT_PATH" --event-name "$EVENT_NAME"
          --fallback-sha "$REVISION" --output "$GITHUB_OUTPUT"
      - name: Explain unsupported source eligibility
        if: steps.revision.outputs.eligible != 'true'
        run: echo 'Software E2E is not scheduled for this event source. Automatic PR execution supports pull requests opened by the repository owner from a same-repository head.' >> "$GITHUB_STEP_SUMMARY"

  software-e2e:
    name: software-e2e (external result)
    needs: revision
    if: needs.revision.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require exact revision Software E2E result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_SHA: ${{ needs.revision.outputs.sha }}
        run: python .github/scripts/software_e2e_result.py --sha "$PUBLIC_SHA" --timeout-seconds 7800
