name: Hub E2E (ephemeral test hub)

# Runs tests/e2e_test.py and the SDK conformance script against a disposable test hub that an
# external workflow boots for this run and ends when this run completes (docs/ephemeral-hub-e2e.md).
# Fork PRs run without approval: the hub is thrown away and the job that runs PR code holds no secrets.
#
# The `e2e` job generates the session keypair and publishes only the public key; `request-hub`
# dispatches the provider with it and relays the still-encrypted session back as an artifact.
# Hub credentials therefore never cross a job boundary in clear text (a masked value cannot be a
# job output, and an unmasked one would print in the consuming step's header).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (blank = current ref)'
        required: false

permissions:
  contents: read

concurrency:
  group: hub-e2e-ephemeral-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Ephemeral lane gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.decide.outputs.sha }}
      repo: ${{ steps.decide.outputs.repo }}
      fork: ${{ steps.decide.outputs.fork }}
    steps:
      # Base ref under pull_request_target: the decision never runs PR code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/lane_gate.js
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED: ${{ secrets.PRIVATE_CI_TOKEN != '' && secrets.SOFTWARE_HUB_PROVIDER != '' }}
          LANE_RUN: ${{ steps.lane.outputs.run }}
          LANE_SKIP: ${{ steps.lane.outputs.skip }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          skip() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$CONFIGURED" = true ] || skip "Ephemeral hub lane not configured."
          # e2e:skip holds only the physical-hub lane; dependency-only bot PRs skip both lanes.
          [ "$LANE_RUN" = true ] || [ "$LANE_SKIP" = true ] || skip "Ephemeral hub E2E not required for this PR."
          if [ "$EVENT_NAME" = pull_request_target ]; then
            sha="$PR_HEAD_SHA"; repo="$PR_HEAD_REPO"
          elif [ -n "$PR_NUMBER" ]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be numeric"; exit 1; }
            head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"\(.head.sha) \(.head.repo.full_name)"')"
            sha="${head% *}"; repo="${head#* }"
          else
            sha="$GITHUB_SHA"; repo="$GITHUB_REPOSITORY"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected head SHA shape"; exit 1; }
          [[ "$repo" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected head repo shape"; exit 1; }
          if [ "$EVENT_NAME" = pull_request_target ]; then
            # Fails safe: an unreadable file list runs the lane.
            if files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
              relevant=false
              while IFS= read -r f; do
                case "$f" in
                  hubitat-mcp-server.groovy|hubitat-mcp-rule.groovy|libraries/*|packageManifest.json|tools/build-release-app.py|tools/strip_source.py|tools/groovy_lex.py|tests/e2e_test.py|tests/sdk_conformance_test.py|tests/sdk_conformance_helpers.py|tests/sdk-conformance-requirements.txt|.github/workflows/hub-e2e-ephemeral.yml|.github/scripts/publish_fork_bundle.sh|.github/scripts/lane_gate.js)
                    relevant=true ;;
                esac
              done <<< "$files"
              [ "$relevant" = true ] || skip "Ephemeral hub E2E not run: no hub-relevant files changed."
            fi
          fi
          {
            echo "run=true"; echo "sha=$sha"; echo "repo=$repo"
            echo "fork=$([ "$repo" != "$GITHUB_REPOSITORY" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  request-hub:
    name: Request ephemeral hub
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # publish_fork_bundle.sh pushes shas/<sha>/ to bundle-artifacts
      actions: read
    outputs:
      provider_run_id: ${{ steps.provider.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.fork == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: needs.gate.outputs.fork == 'true'
        with:
          python-version: '3.x'
      - name: Publish fork PR release artifact
        if: needs.gate.outputs.fork == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_INPUT: ${{ inputs.pr_number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/publish_fork_bundle.sh
      - name: Wait for this revision's published release files
        # publish-bundle-artifact.yml writes shas/<sha>/ on the same push that opened this run; the
        # provider installs from there, so do not request a hub before the files exist.
        env:
          PUBLIC_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 20 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/bundle-artifacts/shas/${PUBLIC_SHA}/hubitat-mcp-server.groovy.size" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Release files for ${PUBLIC_SHA} were not published within 4 minutes."
          exit 1
      - name: Wait for the test job's public key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          until gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "ephemeral-hub-pubkey-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/pub" >/dev/null 2>&1; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::The e2e job published no public key within 10 minutes."; exit 1; }
            sleep 10
          done
      - name: Dispatch the hub and fetch its encrypted session
        id: provider
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
          PROVIDER: ${{ secrets.SOFTWARE_HUB_PROVIDER }}
          PUBLIC_SHA: ${{ needs.gate.outputs.sha }}
          PUBLIC_REPO: ${{ needs.gate.outputs.repo }}
        run: |
          set -euo pipefail
          since="$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ephemeral-hub.yml --repo "$PROVIDER" \
            -f public_key="$(base64 -w0 "$RUNNER_TEMP/pub/session-pub.pem")" \
            -f public_sha="$PUBLIC_SHA" -f public_repo="$PUBLIC_REPO" \
            -f consumer_repo="$GITHUB_REPOSITORY" -f consumer_run_id="$GITHUB_RUN_ID" \
            -f seconds=7200 -f watchdog=false >/dev/null
          export TITLE="Ephemeral hub ${PUBLIC_SHA:0:8} for ${GITHUB_REPOSITORY}#${GITHUB_RUN_ID}" SINCE="$since"
          deadline=$((SECONDS + 1500))
          run_id=""
          while [ -z "$run_id" ]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::The hub provider run did not start within 25 minutes."; exit 1; }
            sleep 10
            run_id="$(gh run list --repo "$PROVIDER" --workflow ephemeral-hub.yml --limit 50 \
              --json databaseId,displayTitle,status,createdAt \
              --jq '[.[] | select(.displayTitle == $ENV.TITLE and .createdAt >= $ENV.SINCE)] | first | .databaseId // empty' || true)"
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          export ARTIFACT="ephemeral-hub-$run_id"
          until [ -n "$(gh api "repos/$PROVIDER/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] | select(.name == $ENV.ARTIFACT) | .id' || true)" ]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::No hub session within 25 minutes."; exit 1; }
            if [ "$(gh run view "$run_id" --repo "$PROVIDER" --json status --jq .status || true)" = completed ]; then
              echo "::error::The hub provider run ended without a session."; exit 1
            fi
            sleep 15
          done
          gh run download "$run_id" --repo "$PROVIDER" --name "$ARTIFACT" --dir "$RUNNER_TEMP/session"
          test -s "$RUNNER_TEMP/session/session.key.enc" && test -s "$RUNNER_TEMP/session/session.json.enc"
      # Still encrypted to the e2e job's key, so the public artifact reveals nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: ephemeral-hub-session-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/session/session.key.enc
            ${{ runner.temp }}/session/session.json.enc
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e (ephemeral hub)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read   # read this run's artifacts and request-hub's status, before any PR code runs
    steps:
      - name: Generate session keypair
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/session-priv.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/session-priv.pem" -pubout -out "$RUNNER_TEMP/pub/session-pub.pem"
      - uses: actions/upload-artifact@v7
        with:
          name: ephemeral-hub-pubkey-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pub/session-pub.pem
          retention-days: 1
          if-no-files-found: error
      - name: Receive and decrypt the hub session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700)); done_polls=0
          until gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "ephemeral-hub-session-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/session" >/dev/null 2>&1; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "Request ephemeral hub") | .conclusion // ""' || true)"
            if [ -n "$state" ] && [ "$state" != success ]; then echo "::error::Request ephemeral hub ended: $state"; exit 1; fi
            # A success carried over from an earlier attempt uploaded nothing for this one.
            [ "$state" != success ] || done_polls=$((done_polls + 1))
            [ "$done_polls" -lt 4 ] || { echo "::error::No session for this attempt; use Re-run all jobs."; exit 1; }
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::No hub session within 45 minutes."; exit 1; }
            sleep 15
          done
          key="$RUNNER_TEMP/session.key"; session="$RUNNER_TEMP/session.json"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/session-priv.pem" -pkeyopt rsa_padding_mode:oaep \
            -in "$RUNNER_TEMP/session/session.key.enc" -out "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$key" -in "$RUNNER_TEMP/session/session.json.enc" -out "$session"
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; printf '%s\n' "$1" >> "$RUNNER_TEMP/masks"; fi; }
          hub_url="$(jq -r '.hub_url // ""' "$session")"
          token="$(jq -r '.access_token // ""' "$session")"
          mask "$hub_url"; mask "${hub_url#https://}"; mask "$token"; mask "$(jq -r '.password // ""' "$session")"
          mask 192.168.255.2; mask "Cloud connection is unavailable."; mask "Zigbee network is offline"
          app_id="$(jq -r '.app_id // "" | tostring' "$session")"
          rm -f "$key" "$session" "$RUNNER_TEMP/session-priv.pem"
          [[ "$hub_url" =~ ^https://[a-z0-9-]+\.trycloudflare\.com$ ]] || { echo "::error::Unexpected hub_url shape."; exit 1; }
          [[ "$app_id" =~ ^[0-9]+$ ]] && [ -n "$token" ] || { echo "::error::Incomplete hub session."; exit 1; }
          {
            echo "HUBITAT_HUB_URL=$hub_url"; echo "HUBITAT_APP_ID=$app_id"; echo "HUBITAT_ACCESS_TOKEN=$token"
          } >> "$GITHUB_ENV"
          echo "Hub session received."
      - name: Mask hub identity
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --max-time 60 -X POST \
            "$HUBITAT_HUB_URL/apps/api/$HUBITAT_APP_ID/mcp?access_token=$HUBITAT_ACCESS_TOKEN" \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' -H 'Mcp-Name: hub_get_info' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"hub_get_info","arguments":{}}}' \
            | jq -r '.result.content[0].text | fromjson
                | [(.. | objects | .hubUID?, .zigbeeId?, .localIP?), .name,
                   (.. | strings | select(test("^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$")))]
                | .[] | select(. != null) | tostring | select(length > 3 and . != "unavailable")' \
            | while IFS= read -r v; do echo "::add-mask::$v"; printf '%s\n' "$v" >> "$RUNNER_TEMP/masks"; done
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          # Fork heads run here without approval: this job holds no secrets and the hub is disposable.
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        id: deps
        run: |
          pip install requests
          pip install -r tests/sdk-conformance-requirements.txt
      - name: Run E2E tests
        env:
          E2E_LANE: ephemeral
          E2E_DEFER_NATIVE_DELETES: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          python tests/e2e_test.py 2>&1 | tee "$RUNNER_TEMP/results/e2e.log"
      - name: SDK conformance (official MCP Python SDK client)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          E2E_LANE: ephemeral
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python tests/sdk_conformance_test.py 2>&1 | tee "$RUNNER_TEMP/results/sdk-conformance.log"
      # Artifacts bypass log masking, so the same values are scrubbed from the files first.
      - name: Redact results
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          python3 - "$RUNNER_TEMP/masks" "$RUNNER_TEMP"/results/*.log <<'EOF'
          import sys
          masks = sorted({m for m in open(sys.argv[1], encoding="utf-8").read().splitlines() if m}, key=len, reverse=True)
          for path in sys.argv[2:]:
              with open(path, encoding="utf-8", errors="replace") as f:
                  text = f.read()
              for m in masks:
                  text = text.replace(m, "***")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
          EOF
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        with:
          name: ephemeral-e2e-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          retention-days: 14
          if-no-files-found: warn
