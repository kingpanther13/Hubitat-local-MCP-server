name: Hub E2E (ephemeral test hub)

# Runs tests/e2e_test.py and the SDK conformance script against a disposable test hub that an
# external workflow boots for this run and ends when this run completes (docs/ephemeral-hub-e2e.md).
#
# PR code runs only here, under `pull_request`: no secrets, read-only token, no base-branch cache
# scope. For PRs the hub is requested by hub-e2e-ephemeral-request.yml (pull_request_target, base
# code only); for push and dispatch the `request-hub` job below does it. Either way the `e2e` job
# generates the session keypair, publishes only the public key, and receives the session encrypted.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    # feat/emulated-e2e-lane: temporary, validates the lane on PR 545 before it exists on main.
    branches: [main, feat/emulated-e2e-lane]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-e2e-ephemeral-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  request-hub:
    name: Request ephemeral hub
    # Trusted refs only; PR runs get their hub from hub-e2e-ephemeral-request.yml.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: configured
        env:
          CONFIGURED: ${{ secrets.PRIVATE_CI_TOKEN != '' && secrets.SOFTWARE_HUB_PROVIDER != '' }}
        run: |
          if [ "$CONFIGURED" = true ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/unavailable"
          echo "Ephemeral hub lane not configured." | tee "$RUNNER_TEMP/unavailable/reason.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.configured.outputs.ready != 'true'
        with:
          name: ephemeral-hub-unavailable
          path: ${{ runner.temp }}/unavailable/reason.txt
          retention-days: 1
          overwrite: true
      - name: Wait for this revision's published release files
        if: steps.configured.outputs.ready == 'true'
        run: bash .github/scripts/request_ephemeral_hub.sh release "$GITHUB_SHA"
      - name: Wait for the test job's public key
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/request_ephemeral_hub.sh key "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/pub"
      - name: Dispatch the hub and fetch its encrypted session
        if: steps.configured.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_CI_TOKEN }}
          PROVIDER: ${{ secrets.SOFTWARE_HUB_PROVIDER }}
          PUBLIC_SHA: ${{ github.sha }}
          PUBLIC_REPO: ${{ github.repository }}
          CONSUMER_RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/request_ephemeral_hub.sh hub "$RUNNER_TEMP/pub/session-pub.pem" "$RUNNER_TEMP/session"
      # Still encrypted to the e2e job's key, so the public artifact reveals nothing.
      - uses: actions/upload-artifact@v7
        if: steps.configured.outputs.ready == 'true'
        with:
          name: ephemeral-hub-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/session/session.key.enc
            ${{ runner.temp }}/session/session.json.enc
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  e2e:
    name: e2e (ephemeral hub)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read   # read the session artifact and the request run's status
    steps:
      - name: Generate session keypair
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/session-priv.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/session-priv.pem" -pubout -out "$RUNNER_TEMP/pub/session-pub.pem"
      - uses: actions/upload-artifact@v7
        with:
          name: ephemeral-hub-public-key-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pub/session-pub.pem
          retention-days: 1
          if-no-files-found: error
      - name: Receive and decrypt the hub session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # A base branch without the request workflow never requests a hub for this PR.
          if [ "$EVENT_NAME" = pull_request ] && ! err="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/hub-e2e-ephemeral-request.yml" \
              -X GET -f ref="$BASE_REF" 2>&1 >/dev/null)" && grep -q "HTTP 404" <<< "$err"; then
            msg="Ephemeral hub lane: request workflow not on the base branch; skipped."
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          export SESSION="ephemeral-hub-session-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          deadline=$((SECONDS + 2700)); first_seen=$((SECONDS + 600)); grace=0
          while :; do
            if [ "$EVENT_NAME" = pull_request ]; then
              # hub-e2e-ephemeral-request.yml requests PR hubs from the base branch for this head.
              info="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow hub-e2e-ephemeral-request.yml \
                --event pull_request_target --commit "$HEAD_SHA" --limit 1 --json databaseId,status,conclusion \
                --jq 'first | select(.) | "\(.databaseId) \(.status) \(.conclusion)"' || true)"
              read -r src state conclusion <<< "$info" || true
              [ -n "${src:-}" ] || [ "$SECONDS" -lt "$first_seen" ] \
                || { echo "::error::No hub request run for this head within 10 minutes."; exit 1; }
            else
              src="$GITHUB_RUN_ID"
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
                --jq '.jobs[] | select(.name == "Request ephemeral hub") | .conclusion // ""' || true)"
              state="$([ -n "$conclusion" ] && echo completed || echo pending)"
            fi
            if [ -n "${src:-}" ]; then
              names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$src/artifacts" --jq '.artifacts[].name' || true)"
              if grep -qxF "$SESSION" <<< "$names"; then
                gh run download "$src" --repo "$GITHUB_REPOSITORY" --name "$SESSION" --dir "$RUNNER_TEMP/session"
                break
              fi
              if [ "$state" = completed ]; then
                if [ "$conclusion" = success ] && grep -qxF ephemeral-hub-unavailable <<< "$names"; then
                  gh run download "$src" --repo "$GITHUB_REPOSITORY" --name ephemeral-hub-unavailable --dir "$RUNNER_TEMP/unavailable"
                  reason="$(head -n1 "$RUNNER_TEMP/unavailable/reason.txt")"
                  echo "$reason"; echo "$reason" >> "$GITHUB_STEP_SUMMARY"
                  echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
                fi
                grace=$((grace + 1))
                [ "$grace" -lt 4 ] || { echo "::error::The hub request ended ($conclusion) without a session for this attempt. Retry with a new commit or close and reopen the PR; for push or dispatch use Re-run all jobs."; exit 1; }
              fi
            fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::No hub session within 45 minutes."; exit 1; }
            sleep 15
          done
          key="$RUNNER_TEMP/session.key"; session="$RUNNER_TEMP/session.json"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/session-priv.pem" -pkeyopt rsa_padding_mode:oaep \
            -in "$RUNNER_TEMP/session/session.key.enc" -out "$key"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$key" -in "$RUNNER_TEMP/session/session.json.enc" -out "$session"
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; printf '%s\n' "$1" >> "$RUNNER_TEMP/masks"; fi; }
          hub_url="$(jq -r '.hub_url // ""' "$session")"
          token="$(jq -r '.access_token // ""' "$session")"
          mask "$hub_url"; mask "${hub_url#https://}"; mask "$token"; mask "$(jq -r '.password // ""' "$session")"
          app_id="$(jq -r '.app_id // "" | tostring' "$session")"
          rm -f "$key" "$session" "$RUNNER_TEMP/session-priv.pem"
          [[ "$hub_url" =~ ^https://[a-z0-9-]+\.trycloudflare\.com$ ]] || { echo "::error::Unexpected hub_url shape."; exit 1; }
          [[ "$app_id" =~ ^[0-9]+$ ]] && [ -n "$token" ] || { echo "::error::Incomplete hub session."; exit 1; }
          {
            echo "HUBITAT_HUB_URL=$hub_url"; echo "HUBITAT_APP_ID=$app_id"; echo "HUBITAT_ACCESS_TOKEN=$token"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Hub session received."
      - name: Mask hub identity
        if: steps.session.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --max-time 60 -X POST \
            "$HUBITAT_HUB_URL/apps/api/$HUBITAT_APP_ID/mcp?access_token=$HUBITAT_ACCESS_TOKEN" \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' -H 'Mcp-Name: hub_get_info' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"hub_get_info","arguments":{"includeHealthAlerts":true}}}' \
            | jq -r '.result.content[0].text | fromjson
                | [(.. | objects | .hubUID?, .zigbeeId?, .localIP?), .name,
                   (.. | objects | .alertItems? | arrays | .[] | objects | .message?),
                   (.. | objects | .alertMessages?, .headerMessages? | select(. != null) | .. | strings),
                   (.. | strings | select(test("^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$")))]
                | .[] | select(. != null) | tostring | select(length > 3 and . != "unavailable")' \
            | while IFS= read -r v; do echo "::add-mask::$v"; printf '%s\n' "$v" >> "$RUNNER_TEMP/masks"; done
      - uses: actions/checkout@v7
        if: steps.session.outputs.ready == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: steps.session.outputs.ready == 'true'
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        id: deps
        if: steps.session.outputs.ready == 'true'
        run: |
          pip install requests
          pip install -r tests/sdk-conformance-requirements.txt
      - name: Run E2E tests
        if: steps.session.outputs.ready == 'true'
        env:
          E2E_LANE: ephemeral
          E2E_DEFER_NATIVE_DELETES: '1'
          # A fast hub finishes the default workloads inside one HTTP leg, so the continuation and write-cap proofs need the larger documented ones.
          E2E_MRTR_ACTION_COUNT: '72'
          E2E_WRITE_CAP_VARIABLE_COUNT: '120'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          python tests/e2e_test.py 2>&1 | tee "$RUNNER_TEMP/results/e2e.log"
      - name: SDK conformance (official MCP Python SDK client)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          E2E_LANE: ephemeral
          E2E_MRTR_ACTION_COUNT: '72'
          E2E_WRITE_CAP_VARIABLE_COUNT: '120'
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python tests/sdk_conformance_test.py 2>&1 | tee "$RUNNER_TEMP/results/sdk-conformance.log"
      # Artifacts bypass log masking, so the same values are scrubbed from the files first.
      - name: Redact results
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          python3 - "$RUNNER_TEMP/masks" "$RUNNER_TEMP"/results/*.log <<'EOF'
          import sys
          masks = sorted({m for m in open(sys.argv[1], encoding="utf-8").read().splitlines() if m}, key=len, reverse=True)
          for path in sys.argv[2:]:
              with open(path, encoding="utf-8", errors="replace") as f:
                  text = f.read()
              for m in masks:
                  text = text.replace(m, "***")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
          EOF
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        with:
          name: ephemeral-e2e-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          retention-days: 14
          if-no-files-found: warn
