name: TMP fork-bundle check (throwaway, no hub)
on:
  push:
    branches: [tmp/fork-bundle-check]
permissions:
  contents: write
  pull-requests: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint hub-e2e.yml
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -shellcheck= -ignore 'unexpected key "queue"' .github/workflows/hub-e2e.yml

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Dry-run the fork scan against PR 426
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: '426'
          SCAN_DRY_RUN: '1'
        run: python .github/scripts/fork_pr_scan.py

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Fork commit (pull_request_target shape) -> publish shas/<sha>/
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          EVENT_NAME: pull_request_target
          PR_HEAD_REPO: GordonThelander/Hubitat-local-MCP-server
          PR_HEAD_SHA: 92157dc4c8ac65ac5b0ccc18c18f08e0b92d89d3
        run: bash .github/scripts/publish_fork_bundle.sh
      - name: Verify the published entry via the deploy's exact URL shape
        run: |
          U=https://raw.githubusercontent.com/${{ github.repository }}/bundle-artifacts/shas/92157dc4c8ac65ac5b0ccc18c18f08e0b92d89d3/mcp-libraries.zip
          curl -fsSL "$U" -o /tmp/pub.zip && cmp bundles/mcp-libraries.zip /tmp/pub.zip && echo "byte-identical: $U"
      - name: Reset tree for next case
        run: git checkout -- . && git clean -fdq -e bundles
      - name: Same-repo PR -> no-op
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          EVENT_NAME: workflow_dispatch
        run: |
          PR_INPUT=$(gh pr list -R "$BASE_REPO" --state merged -L 30 --json number,isCrossRepository --jq '[.[]|select(.isCrossRepository|not)][0].number')
          export PR_INPUT
          out=$(bash .github/scripts/publish_fork_bundle.sh)
          echo "$out"
          echo "$out" | grep -q "Same-repo PR" || { echo "::error::same-repo PR did not no-op"; exit 1; }
