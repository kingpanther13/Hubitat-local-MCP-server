name: PR Guard
on:
  # Manual run on any ref, no PR needed -- opening a PR just to exercise a lane also
  # books the single shared test hub for an hour of e2e.
  workflow_dispatch:
  pull_request:
    # The guide PR is stacked on this maintained fixes branch.
    branches: [main, pr/fixes-447-449-455-471]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      # A dispatch has no PR to read a base off, so fall back to the default branch --
      # the same diff the PR run would take. Kept out of `run:`/`with:` interpolation so
      # a ref name can never be spliced into the shell.
      BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin "$BASE_BRANCH"
      # Dependabot commits through the API, bypassing .gitattributes, so a wrapper
      # bump can land gradlew.bat with CRLF in the index.
      - name: Check line endings match .gitattributes
        run: |
          git add --renormalize .
          git diff --cached --name-only --exit-code || {
            echo "::error::Files above are committed with line endings that .gitattributes would normalize. Run: git add --renormalize <file>"
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Run PR guard
        env:
          BASE_REF: origin/${{ env.BASE_BRANCH }}
        run: python .github/scripts/pr_guard.py
