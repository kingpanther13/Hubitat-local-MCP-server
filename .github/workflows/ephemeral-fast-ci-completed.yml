name: Resume ephemeral E2E when fast CI passes
# Runs from the default branch only. Keep workflows: equal to EphemeralFastCI::REQUIRED + FILTERED
# (tests/test_ephemeral_fast_ci.py checks it).

on:
  workflow_run:
    workflows: [Unit Tests, PR Guard, Groovy 2.5 Spock (additive), Groovy 2.4 Parse Check, Sandbox Lint,
                Python Tests, Ruff, Self-deploy recovery (hub-less), lane-gate-test, lease-scripts-test,
                Dependency update configuration]
    types: [completed]

permissions: {}

jobs:
  resume:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    concurrency:
      group: resume-ephemeral-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resume workflows blocked on fast CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/resume_ephemeral_ci.rb
