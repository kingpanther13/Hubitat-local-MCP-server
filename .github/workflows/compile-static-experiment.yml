name: Compile Static Experiment
on:
  push:
    branches: [experiment/529-compile-static]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [discover, connected, closures, broad-closures, catalog, verify]
        default: verify
      publish:
        description: Publish verified isolated clone after all non-E2E workflows pass for this SHA
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Measure bytecode or run explicitly selected discovery
        if: inputs.mode != 'connected' && inputs.mode != 'closures' && inputs.mode != 'broad-closures' && inputs.mode != 'catalog'
        env:
          EXPERIMENT_MODE: ${{ inputs.mode || 'verify' }}
        run: ./gradlew -p experiments/compile-static measure -PexperimentMode="$EXPERIMENT_MODE" --console=plain --no-daemon
      - name: Discover connected helpers under Groovy 2.4
        if: inputs.mode == 'connected'
        run: ./gradlew -p experiments/compile-static discoverConnected24 --console=plain --no-daemon
      - name: Discover connected helpers with the Groovy 3.0 typed harness
        if: inputs.mode == 'connected'
        run: ./gradlew -I "$PWD/experiments/compile-static/connected.init.gradle" discoverConnected -PexperimentRepoRoot="$PWD" --console=plain --no-daemon
      - name: Discover connected helpers with the Groovy 2.5 typed harness
        if: inputs.mode == 'connected'
        run: ./gradlew -p ci/groovy2x-spock -I "$PWD/experiments/compile-static/connected.init.gradle" discoverConnected -PexperimentRepoRoot="$PWD" --console=plain --no-daemon
      - name: Prepare closure-to-loop source artifacts
        if: inputs.mode == 'closures'
        run: ./gradlew --no-daemon -I experiments/closure-loops/remote.gradle bat529ClosurePrepare --console=plain
      - name: Prepare embedded catalog source artifacts
        if: inputs.mode == 'catalog'
        run: ./gradlew -p experiments/catalog-json prepareCatalog24 --console=plain --no-daemon
      - name: Prepare broad named collection callback source
        if: inputs.mode == 'broad-closures'
        run: ./gradlew --no-daemon -I experiments/closure-loops/remote.gradle bat529BroadClosurePrepare --console=plain
      - name: Build isolated HPM clone from release artifact
        if: inputs.mode != 'closures' && inputs.mode != 'broad-closures' && inputs.mode != 'catalog'
        run: |
          python3 tools/build-release-app.py
          python3 experiments/compile-static/hpm/build_clone.py --version "$(cat experiments/compile-static/hpm/version.txt)" --source-sha "$GITHUB_SHA"
      - name: Check cloned apps under Groovy 2.4 and sandbox/bytecode budgets
        if: inputs.mode != 'closures' && inputs.mode != 'broad-closures' && inputs.mode != 'catalog'
        run: ./gradlew -p experiments/compile-static parseClone --console=plain --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compile-static-${{ github.sha }}
          path: |
            experiments/compile-static/results/
            experiments/closure-loops/results/
            experiments/catalog-json/results/
            dist/experiment-hpm/
            build/test-results/test/
            ci/groovy2x-spock/build/test-results/test/
  publish:
    needs: measure
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.mode == 'verify' && github.ref == 'refs/heads/experiment/529-compile-static'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: bundle-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Require all non-E2E workflows successful for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/compile-static/check_ci.py --output non-e2e-validation.json
      - uses: actions/download-artifact@v4
        with:
          name: compile-static-${{ github.sha }}
          path: incoming
      - name: Publish the verified CI artifact to isolated experiment paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin bundle-artifacts
          git worktree add --detach ../experiment-artifacts origin/bundle-artifacts
          python3 experiments/compile-static/stage_publication.py --artifact incoming --target ../experiment-artifacts --validation non-e2e-validation.json
          # Recheck immediately before the write; every current run must have completed.
          python3 experiments/compile-static/check_ci.py --output non-e2e-validation.json
          cp non-e2e-validation.json "../experiment-artifacts/experiments/529/${GITHUB_SHA}/non-e2e-validation.json"
          cd ../experiment-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments/529
          if git diff --cached --quiet; then
            echo "Experiment artifact already published for ${GITHUB_SHA}."
            exit 0
          fi
          git commit -m "compile-static experiment artifact: ${GITHUB_SHA}"
          for attempt in 1 2 3; do
            if git push origin HEAD:bundle-artifacts; then
              echo "Published isolated experiment artifact for ${GITHUB_SHA}."
              exit 0
            fi
            if ! git pull --rebase origin bundle-artifacts; then
              git rebase --abort 2>/dev/null || true
            fi
          done
          echo "::error::Could not publish the experiment artifact after 3 attempts."
          exit 1
