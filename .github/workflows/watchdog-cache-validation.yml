name: Watchdog cache validation
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string
      suite:
        type: choice
        options: [regression, full]
        default: regression
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [groovy3, groovy25]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Run tests
        env:
          RUNTIME: ${{ matrix.runtime }}
          SUITE: ${{ inputs.suite }}
        run: |
          args=()
          if [ "$RUNTIME" = groovy25 ]; then args+=(-p ci/groovy2x-spock); fi
          args+=(test --console=plain)
          if [ "$SUITE" = regression ]; then args+=(--tests support.WatchdogCompilationSpec); fi
          ./gradlew "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ matrix.runtime }}
          path: |
            build/test-results/test/
            ci/groovy2x-spock/build/test-results/test/
