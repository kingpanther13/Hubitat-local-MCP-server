name: Dependency coverage experiment
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [smoke, full, focused, latch-check, analyze]
        default: smoke
      source_run:
        description: Existing full run to analyze without rerunning tests
        type: string
        default: ''
      source_scope:
        description: Scope of the saved run when analyzing artifacts
        type: choice
        options: [full, focused]
        default: full
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    if: inputs.scope != 'analyze'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        versions: [baseline, candidate]
        lane: ${{ fromJSON(inputs.scope == 'focused' && '["primary-r1", "primary-r2", "groovy25-r1", "groovy25-r2"]' || (inputs.scope == 'smoke' || inputs.scope == 'latch-check') && '["primary", "groovy25"]' || '["primary", "flat", "strict", "strict-flat", "groovy25"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Select original dependency declarations
        if: matrix.versions == 'baseline'
        run: |
          git fetch --depth=1 origin 38115a634b3853c474f093da93c5c9240aa32b1e
          git show 38115a634b3853c474f093da93c5c9240aa32b1e:build.gradle > build.gradle
          git show 38115a634b3853c474f093da93c5c9240aa32b1e:ci/groovy2x-spock/build.gradle > ci/groovy2x-spock/build.gradle
      - name: Assert the suspected hidden latch timeout (diagnostic only)
        if: inputs.scope == 'latch-check'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/test/groovy/server/MrtrContinuationSpec.groovy')
          source = path.read_text()
          needle = '\n            ownerDone.await(5, TimeUnit.SECONDS)'
          assert source.count(needle) == 1
          path.write_text(source.replace(needle, '\n            assert ownerDone.await(5, TimeUnit.SECONDS) : "Owner completion wait timed out inside the mock callback"'))
          PY
      - name: Run instrumented tests
        env:
          LANE: ${{ matrix.lane }}
          SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          export COVERAGE_AGENT=$(python3 ci/dependency-coverage/prepare_agent.py)
          args=(--init-script "$PWD/ci/dependency-coverage/coverage.init.gradle" --no-daemon --console=plain --rerun-tasks)
          case "$LANE" in
            groovy25*) args+=(-p ci/groovy2x-spock -PharnessStrictMetaClass=true) ;;
            strict) args+=(-PharnessStrictMetaClass=true) ;;
            strict-flat) args+=(-PharnessStrictMetaClass=true -Pharness.useGateways=false) ;;
            flat) args+=(-Pharness.useGateways=false) ;;
          esac
          args+=(test)
          if [[ "$SCOPE" == smoke || "$SCOPE" == focused || "$SCOPE" == latch-check ]]; then
            args+=(--tests server.McpWireSchemaConformanceSpec --tests rules.HandleDeviceEventSpec --tests server.WatchdogV31PackageDeploySpec)
          fi
          if [[ "$SCOPE" == focused ]]; then
            args+=(--tests server.MrtrContinuationSpec --tests server.ToolRmNativeCrudSpec --tests server.WatchdogV3ManualSpec)
          fi
          if [[ "$SCOPE" == latch-check ]]; then
            args+=(--tests 'server.MrtrContinuationSpec.a rejoined call that observes the original finishing gets its result marked rejoined')
          fi
          ./gradlew "${args[@]}" 2>&1 | tee coverage-run.log
          python3 ci/dependency-coverage/check_logs.py coverage-run.log build/test-results/test ci/groovy2x-spock/build/test-results/test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.lane }}-${{ matrix.versions }}
          path: |
            build/dependency-coverage/
            build/test-results/test/
            ci/groovy2x-spock/build/dependency-coverage/
            ci/groovy2x-spock/build/test-results/test/
            coverage-run.log
          retention-days: 14
  compare:
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage-artifacts
          run-id: ${{ inputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Compare bytecode identities, probes, lines, branches and tests
        id: comparison
        continue-on-error: true
        env:
          SCOPE: ${{ inputs.scope == 'analyze' && inputs.source_scope || inputs.scope }}
        run: python3 ci/dependency-coverage/compare.py coverage-artifacts "$SCOPE"
      - uses: actions/setup-java@v6
        if: steps.comparison.outcome == 'failure'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        if: steps.comparison.outcome == 'failure'
      - name: Resolve changed probes to application source lines and methods
        if: steps.comparison.outcome == 'failure'
        run: |
          export COVERAGE_ARTIFACTS="$PWD/coverage-artifacts"
          ./gradlew --init-script ci/dependency-coverage/details.init.gradle --no-daemon --console=plain dependencyCoverageDetails
      - name: Compare repeated runs without changing dependencies
        if: inputs.scope == 'focused' || (inputs.scope == 'analyze' && inputs.source_scope == 'focused')
        shell: bash
        run: |
          set -euo pipefail
          for version in baseline candidate; do
            destination="$PWD/repeat-$version"
            mkdir -p "$destination"
            for lane in primary groovy25; do
              ln -s "$PWD/coverage-artifacts/coverage-$lane-r1-$version" "$destination/coverage-$lane-baseline"
              ln -s "$PWD/coverage-artifacts/coverage-$lane-r2-$version" "$destination/coverage-$lane-candidate"
            done
            if python3 ci/dependency-coverage/compare.py "$destination" smoke; then
              echo "Identical repeated coverage for $version"
            else
              test -f "$destination/comparison.json"
            fi
            export COVERAGE_ARTIFACTS="$destination"
            ./gradlew --init-script ci/dependency-coverage/details.init.gradle --no-daemon --console=plain dependencyCoverageDetails
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-comparison
          path: |
            coverage-artifacts/comparison.json
            coverage-artifacts/application-differences.json
            repeat-baseline/comparison.json
            repeat-baseline/application-differences.json
            repeat-candidate/comparison.json
            repeat-candidate/application-differences.json
          retention-days: 14
      - name: Preserve any comparison failure
        if: steps.comparison.outcome == 'failure'
        run: exit 1
