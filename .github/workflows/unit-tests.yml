name: Dependency coverage experiment
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [smoke, full, analyze]
        default: smoke
      source_run:
        description: Existing full run to analyze without rerunning tests
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    if: inputs.scope != 'analyze'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        versions: [baseline, candidate]
        lane: ${{ fromJSON(inputs.scope == 'smoke' && '["primary", "groovy25"]' || '["primary", "flat", "strict", "strict-flat", "groovy25"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Select original dependency declarations
        if: matrix.versions == 'baseline'
        run: |
          git fetch --depth=1 origin 38115a634b3853c474f093da93c5c9240aa32b1e
          git show 38115a634b3853c474f093da93c5c9240aa32b1e:build.gradle > build.gradle
          git show 38115a634b3853c474f093da93c5c9240aa32b1e:ci/groovy2x-spock/build.gradle > ci/groovy2x-spock/build.gradle
      - name: Run instrumented tests
        env:
          LANE: ${{ matrix.lane }}
          SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          export COVERAGE_AGENT=$(python3 ci/dependency-coverage/prepare_agent.py)
          args=(--init-script "$PWD/ci/dependency-coverage/coverage.init.gradle" --no-daemon --console=plain --rerun-tasks)
          case "$LANE" in
            groovy25) args+=(-p ci/groovy2x-spock -PharnessStrictMetaClass=true) ;;
            strict) args+=(-PharnessStrictMetaClass=true) ;;
            strict-flat) args+=(-PharnessStrictMetaClass=true -Pharness.useGateways=false) ;;
            flat) args+=(-Pharness.useGateways=false) ;;
          esac
          args+=(test)
          if [[ "$SCOPE" == smoke ]]; then
            args+=(--tests server.McpWireSchemaConformanceSpec --tests rules.HandleDeviceEventSpec --tests server.WatchdogV31PackageDeploySpec)
          fi
          ./gradlew "${args[@]}" 2>&1 | tee coverage-run.log
          python3 ci/dependency-coverage/check_logs.py coverage-run.log build/test-results/test ci/groovy2x-spock/build/test-results/test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.lane }}-${{ matrix.versions }}
          path: |
            build/dependency-coverage/
            build/test-results/test/
            ci/groovy2x-spock/build/dependency-coverage/
            ci/groovy2x-spock/build/test-results/test/
            coverage-run.log
          retention-days: 14
  compare:
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage-artifacts
          run-id: ${{ inputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Compare bytecode identities, probes, lines, branches and tests
        env:
          SCOPE: ${{ inputs.scope }}
        run: python3 ci/dependency-coverage/compare.py coverage-artifacts "$SCOPE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-comparison
          path: coverage-artifacts/comparison.json
          retention-days: 14
