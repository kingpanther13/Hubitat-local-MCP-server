name: Closure Reduction Experiment
on:
  push:
    branches: [experiment/529-main-closures]
    paths: [experiments/closure-loops/**, experiments/catalog-json/**, .github/workflows/closure-reduction-experiment.yml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Generate named collection callbacks under Groovy 2.4
        if: ${{ !contains(github.event.head_commit.message, '[catalog]') && !contains(github.event.head_commit.message, '[cpcount]') }}
        run: ./gradlew --no-daemon -I experiments/closure-loops/remote.gradle bat529BroadClosurePrepare --console=plain
      - name: Count main-class constant-pool entries under Groovy 2.4
        if: ${{ contains(github.event.head_commit.message, '[cpcount]') }}
        run: |
          python3 tools/build-release-app.py
          curl -sSLo groovy.jar https://repo1.maven.org/maven2/org/codehaus/groovy/groovy-all/2.4.21/groovy-all-2.4.21.jar
          java -cp groovy.jar groovy.ui.GroovyMain experiments/closure-loops/cpcount.groovy dist/hubitat-mcp-server.groovy
      - name: Embed large constant data under Groovy 2.4
        if: ${{ !contains(github.event.head_commit.message, '[cpcount]') }}
        run: ./gradlew -p experiments/catalog-json prepareCatalog24 --console=plain --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closure-reduction-${{ github.sha }}
          path: |
            experiments/closure-loops/results/broad/
            experiments/catalog-json/results/groovy24/
