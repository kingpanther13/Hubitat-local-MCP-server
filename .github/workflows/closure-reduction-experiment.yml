name: Closure Reduction Experiment
on:
  push:
    branches: [experiment/529-main-closures]
    paths: [experiments/closure-loops/**, .github/workflows/closure-reduction-experiment.yml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Generate named collection callbacks under Groovy 2.4
        run: ./gradlew --no-daemon -I experiments/closure-loops/remote.gradle bat529BroadClosurePrepare --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closure-reduction-${{ github.sha }}
          path: experiments/closure-loops/results/broad/
