// Attach with -I only in the authorized GitHub Actions experiment job.
allprojects {
    if (project == rootProject) {
        def preparation = rootProject.file(System.getenv('BAT529_CLOSURE_PREP') ?: 'experiments/closure-loops')
        def artifacts = rootProject.file(System.getenv('BAT529_CLOSURE_OUTPUT') ?: 'experiments/closure-loops/results')
        configurations.maybeCreate('bat529ClosureGroovy24')
        repositories { mavenCentral() }
        dependencies { bat529ClosureGroovy24 'org.codehaus.groovy:groovy-all:2.4.21' }
        tasks.register('bat529ClosureParity', JavaExec) {
            workingDir rootDir
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(11) }
            classpath = configurations.bat529ClosureGroovy24
            mainClass = 'groovy.ui.GroovyMain'
            args = [new File(preparation, 'parity.groovy').absolutePath,
                    new File(preparation, 'convert.groovy').absolutePath,
                    new File(artifacts, 'parity.json').absolutePath]
            doFirst {
                if (System.getenv('GITHUB_ACTIONS') != 'true') throw new GradleException('GitHub Actions only')
            }
        }
        tasks.register('bat529ClosurePrepare', JavaExec) {
            workingDir rootDir
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(11) }
            classpath = configurations.bat529ClosureGroovy24
            mainClass = 'groovy.ui.GroovyMain'
            args = [new File(preparation, 'convert.groovy').absolutePath,
                    rootDir.absolutePath, artifacts.absolutePath]
            doFirst {
                if (System.getenv('GITHUB_ACTIONS') != 'true') throw new GradleException('GitHub Actions only')
            }
        }
        tasks.register('bat529ClosureInventory', JavaExec) {
            workingDir rootDir
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(11) }
            classpath = configurations.bat529ClosureGroovy24
            mainClass = 'groovy.ui.GroovyMain'
            args = [new File(preparation, 'convert.groovy').absolutePath, '--inventory',
                    rootDir.absolutePath, new File(artifacts, 'inventory').absolutePath]
            doFirst {
                if (System.getenv('GITHUB_ACTIONS') != 'true') throw new GradleException('GitHub Actions only')
            }
        }
    }
}
