// Isolated Groovy 2.4 parse smoke-check (issue #105 PR2a).
//
// Standalone build -- intentionally does NOT touch the root build.gradle or its Groovy 3.0
// test lane. It resolves a stock Groovy 2.4.21 (the version Hubitat's hub runtime uses) from
// Maven Central and parses the production .groovy files under the 2.4 grammar, so a
// 3.0-green can't ship a 2.4 hub-load failure.
//
// Run locally:  ./gradlew -p ci/groovy24-parse parse24
plugins {
    id 'java'   // for the Java toolchain + JavaExec
}

repositories { mavenCentral() }

// Pin the runner to JDK 11 -- Groovy 2.4.x is unhappy on JDK 17/21 (sun.* encapsulation).
java {
    toolchain { languageVersion = JavaLanguageVersion.of(11) }
}

configurations { groovy24 }
dependencies { groovy24 'org.codehaus.groovy:groovy-all:2.4.21' }

def repoRoot = projectDir.parentFile.parentFile
def productionFiles = [
    new File(repoRoot, 'hubitat-mcp-server.groovy'),
    new File(repoRoot, 'hubitat-mcp-rule.groovy'),
    // Standalone e2e safety-net apps: parse them here so a syntax / 3.0-only break (or a sandbox-blocked
    // ClassExpression) is caught in the fast lane, not only when the arm/self-update scripts compile them
    // live on the e2e hub. The v2 watchdog is the active one (it is self-deployed from the PR head every
    // e2e run, so a sandbox violation there would otherwise surface only at the live self-update step).
    // No #include, so the resolver passes them through unchanged.
    new File(repoRoot, 'e2e-deadman-watchdog.groovy'),
    new File(repoRoot, 'e2e-deadman-watchdog-v2.groovy'),
    new File(repoRoot, 'tests/fixtures/deadman-test-target.groovy'),
    new File(repoRoot, 'tests/fixtures/e2e-throwaway-lib.groovy'),
    new File(repoRoot, 'tests/fixtures/app-code-update.groovy'),
    new File(repoRoot, 'tests/fixtures/app-trigger-updated.groovy'),
    new File(repoRoot, 'tests/fixtures/driver-code-update.groovy'),
]

tasks.register('parse24Fixtures', JavaExec) {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(11) }
    classpath = configurations.groovy24
    mainClass = 'groovy.ui.GroovyMain'
    args = [new File(projectDir, 'parse_check.groovy').absolutePath, '--self-test', repoRoot.absolutePath]
}

tasks.register('parse24', JavaExec) {
    dependsOn 'parse24Fixtures'
    group = 'verification'
    description = 'Check deployed Groovy for 2.4 syntax, null closure parameters, and sandbox-blocked classes.'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(11) }
    classpath = configurations.groovy24
    mainClass = 'groovy.ui.GroovyMain'
    args = [new File(projectDir, 'parse_check.groovy').absolutePath] + productionFiles*.absolutePath
}
